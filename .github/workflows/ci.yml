name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lisp-tests:
    name: Common Lisp Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SBCL
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl

    - name: Install ocicl
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Authenticated download: the anonymous releases API is rate-limited
        # and returns empty on 403, which broke tag builds (v0.2.2).
        gh release download --repo ocicl/ocicl --pattern '*_amd64.deb' --dir /tmp
        sudo dpkg -i /tmp/ocicl_*_amd64.deb
        ocicl setup > ~/.sbclrc
        ocicl version

    - name: Install dependencies
      run: |
        ocicl install

    - name: Build ag-protoc
      run: make ag-protoc

    - name: Generate protobuf code
      run: make src/grpc-proto.lisp

    - name: Run tests
      run: |
        sbcl --non-interactive \
          --eval "(asdf:load-system :fiveam)" \
          --eval "(asdf:load-system :cloodoo)" \
          --load tests/tests.lisp \
          --eval "(uiop:quit (if (cloodoo-tests:run-tests) 0 1))"

    - name: Build executable
      run: make cloodoo

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloodoo-linux-x86_64
        path: cloodoo
        retention-days: 7
